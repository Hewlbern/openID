services:
  solid:
    image: ghcr.io/hewlbern/openid:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${SOLID_PORT:-3000}:3000"
    volumes:
      - solid-data:/data
    environment:
      SOLID_PORT: "3000"
      SOLID_STORAGE_PATH: /data
      SOLID_BASE_URL: ${SOLID_BASE_URL:-http://localhost:3000}
      SOLID_TOKEN_SECRET: ${SOLID_TOKEN_SECRET:-change-me-in-production}
      SOLID_LOG_LEVEL: ${SOLID_LOG_LEVEL:-info}
      AUDIT_BATCH_INTERVAL: ${AUDIT_BATCH_INTERVAL:-30s}
      IPFS_API: ${IPFS_API:-}
      SOLID_SYNC_PEER: ${SOLID_SYNC_PEER:-}
      SOLID_SYNC_HANDLE: ${SOLID_SYNC_HANDLE:-}
      SOLID_SYNC_PASSWORD: ${SOLID_SYNC_PASSWORD:-}
      SOLID_SYNC_INTERVAL: ${SOLID_SYNC_INTERVAL:-2m}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  ipfs:
    image: ipfs/kubo:v0.32.1
    profiles: ["ipfs"]
    ports:
      - "4001:4001"
      - "5001:5001"
      - "8081:8080"
    volumes:
      - ipfs-data:/data/ipfs
    environment:
      IPFS_PROFILE: server
    restart: unless-stopped

volumes:
  solid-data:
  ipfs-data:
