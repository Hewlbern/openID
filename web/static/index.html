<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>oid</title>
  <meta name="description" content="Claim a Solid handle. One WebID for you and the agents you allow." />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/styles.css" />
  <script src="/static/config.js"></script>
</head>
<body>
  <header class="title">
    <a class="brand" href="/">
      <span class="mark" aria-hidden="true"></span>
      <span class="app-name">oid</span>
    </a>
    <span class="status" id="apiStatus"></span>
  </header>

  <section class="sign-in">
    <span class="mark hero" aria-hidden="true"></span>
    <h1>oid</h1>
    <p class="lead" id="gateLead">Claim a handle. Then take Spark into your Solid pod.</p>

    <form class="composer" id="claimForm">
      <input id="handle" name="handle" autocomplete="off" spellcheck="false" placeholder="What should we call you?" aria-label="Choose your handle" />
      <button class="go" id="claimBtn" type="submit" disabled aria-label="Claim this handle">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13 V4 M4.6 7.4 L8 4 L11.4 7.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </form>
    <p class="sr-claim">Claim this handle</p>

    <form class="composer" id="loginForm" hidden autocomplete="on">
      <input name="handle" required placeholder="Handle" autocomplete="username" aria-label="Handle" />
      <input name="password" type="password" required placeholder="Password" autocomplete="current-password" aria-label="Password" />
      <button type="submit" class="go" aria-label="Sign in">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13 V4 M4.6 7.4 L8 4 L11.4 7.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </form>

    <div class="status" id="claimStatus"></div>
    <p class="switch">
      <button type="button" id="loginBtn">Sign in</button>
      <button type="button" id="signupBtn" hidden>Claim a handle</button>
    </p>
    <div class="chips">
      <a href="/dashboard">Solid server</a>
      <a href="/app">Passport</a>
      <a href="/records">Your records</a>
      <span data-prefix>openid/i/</span>
    </div>
  </section>

  <footer class="legal">
    By claiming a handle you get a Solid WebID and a pod on the OpenID origin.
    <a href="https://github.com/Hewlbern/openID">Source</a>
    · <a href="/.well-known/openid-configuration">OIDC</a>
  </footer>

  <div class="modal-bg" id="claimModal">
    <form class="modal" id="registerForm">
      <h3>Claim <span id="modalHandle">you</span></h3>
      <p>Create a password for your Solid pod. You can add an email later.</p>
      <div class="field"><label>Display name</label><input name="name" required /></div>
      <div class="field"><label>Password</label><input name="password" type="password" required minlength="8" /></div>
      <div class="field"><label>Email (optional)</label><input name="email" type="email" /></div>
      <button class="btn wide" type="submit">Create my passport</button>
    </form>
  </div>
  <script src="/static/site.js"></script>
</body>
</html>
