<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>oid</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/styles.css" />
  <script src="/static/config.js"></script>
</head>
<body>
  <header class="title">
    <a class="brand" href="/">
      <span class="mark" aria-hidden="true"></span>
      <span class="app-name">oid</span>
    </a>
    <a class="ghost" href="/" style="margin-left:auto">Claim a handle</a>
  </header>
  <main class="profile-page">
    <div class="face" id="avatar"></div>
    <h1 id="name">…</h1>
    <p class="mono" id="handle"></p>
    <p id="bio" class="lede"></p>
    <p class="mono" id="webid"></p>
    <p><a id="pod" href="#">Solid pod →</a></p>
  </main>
  <script>
    const handle = location.pathname.replace(/^\/i\//, "").replace(/\/$/, "");
    function hueFor(s) {
      let n = 18;
      String(s || "").split("").forEach((c) => { n = (n * 31 + c.charCodeAt(0)) % 360; });
      return n;
    }
    openidFetch("/i/" + encodeURIComponent(handle), { headers: { Accept: "application/json" } })
      .then((r) => { if (!r.ok) throw r; return r.json(); })
      .then((p) => {
        document.title = (p.name || p.handle) + " — oid";
        document.getElementById("name").textContent = p.name || p.handle;
        document.getElementById("handle").textContent = "/i/" + p.handle;
        document.getElementById("bio").textContent = p.bio || "This Solid identity is still being written.";
        document.getElementById("webid").textContent = p.webId;
        document.getElementById("pod").href = p.pod;
        document.getElementById("avatar").style.setProperty("--h", String(hueFor(p.handle)));
      })
      .catch(() => {
        document.getElementById("name").textContent = "Handle not claimed";
        document.getElementById("bio").textContent = "This /i/ page does not exist yet.";
      });
  </script>
</body>
</html>
