<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>oid — Records</title>
  <meta name="description" content="Private archive of conversations and traces on your Solid pod." />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/dash.css" />
  <link rel="stylesheet" href="/static/records.css" />
  <script src="/static/config.js"></script>
</head>
<body>
  <header class="bar" data-tauri-drag-region>
    <a class="brand" href="/">
      <span class="mark" aria-hidden="true"></span>
      <span>oid <small>Records</small></span>
    </a>
    <form class="find" id="findForm" hidden>
      <input id="q" type="search" autocomplete="off" spellcheck="false"
        placeholder="Search this directory" aria-label="Search records" />
      <button type="button" class="clear" id="clearQ" hidden>Clear</button>
    </form>
    <span class="pill" id="privacyPill">owner only</span>
    <a class="quiet-link" href="/">Home</a>
    <button type="button" class="quiet-link in-only" id="logout">Log out</button>
  </header>

  <main class="records">
    <section id="gate" class="stage">
      <span class="mark hero-mark" aria-hidden="true"></span>
      <h1>Your records</h1>
      <p class="sub">Private archive on your pod. Sign in to open the directory.</p>
      <section class="auth">
        <form id="loginForm" class="auth-form" autocomplete="on">
          <label>
            Handle
            <input name="handle" required value="mike" autocomplete="username" />
          </label>
          <label>
            Password
            <span class="pw">
              <input name="password" type="password" required autocomplete="current-password" />
              <button type="button" class="reveal" data-reveal aria-label="Show password">Show</button>
            </span>
          </label>
          <p class="auth-msg" id="gateMsg" role="status"></p>
          <button class="btn wide" type="submit">Open records</button>
        </form>
      </section>
    </section>

    <section id="archive" hidden>
      <nav class="crumbs" id="crumbs" aria-label="Path"></nav>
      <p class="hint" id="traceMeta"></p>
      <div class="browser">
        <div class="listing" id="listing"></div>
        <aside class="preview" id="preview">
          <p class="hint">Select a folder or file.</p>
        </aside>
      </div>

      <details class="more">
        <summary>SPARQL and pod settings</summary>
        <p class="lede" id="whoLine"></p>
        <div class="stats" id="stats"></div>
        <div class="grid">
          <article class="card">
            <h2>Agents</h2>
            <dl class="kv" id="grokKV"></dl>
          </article>
          <article class="card">
            <h2>This pod</h2>
            <dl class="kv" id="podKV"></dl>
            <form id="pwForm" class="stack" style="margin-top:14px">
              <label>Set a new password</label>
              <input name="password" type="password" required minlength="8" placeholder="at least 8 characters" />
              <button class="btn ghost" type="submit">Save password</button>
              <p class="msg" id="pwMsg"></p>
            </form>
          </article>
        </div>
        <article class="card" id="sparqlCard">
          <h2>SPARQL</h2>
          <form id="sparqlForm" class="row">
            <input id="sparql" type="search" autocomplete="off" spellcheck="false" placeholder="SELECT ?name WHERE { … }" />
            <button class="btn" type="submit">Query</button>
          </form>
          <div class="chips" id="sparqlExamples"></div>
          <p class="hint" id="sparqlMeta"></p>
          <pre class="code" id="sparqlSent" hidden></pre>
          <div class="sparql-results" id="sparqlResults"></div>
        </article>
        <div class="row wrap" style="margin-top:12px">
          <a class="btn ghost" href="/mike/records/catalog.jsonld" id="rawLink">JSON-LD catalog</a>
          <a class="btn ghost" href="/mike/records/catalog.ttl" id="rdfLink">RDF</a>
        </div>
      </details>
    </section>
  </main>
  <script src="/static/records.js"></script>
</body>
</html>
